# One experiment: 4 agents on Forge peg-insert, in one Isaac Sim instance on one GPU.
# Each agent owns 64 of the 256 envs.
# Run:
#   python scripts/train.py --config examples/forge_exp.yaml --headless \
#       task.cfg.scene.num_envs=128 experiment.seed=3
base: forge_base.yaml

experiment:
  num_agents: 4
  seed: 10

wandb:
  group: fgain_k100
  tags:
    - fgain
    - baseline

task:
  cfg:
    scene:
      num_envs: 256

sac:
  batch_size: 256
  learning_starts: 1000
  grad_norm_clip: 1.0
  lr_schedule: cosine

memory:
  memory_size: 200000
