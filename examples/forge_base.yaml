# Base config for the Isaac Lab Forge peg-insert task.
# Only what every Forge experiment shares. Defaults that are right for most experiments
# belong in the Python config classes, not here.
task:
  name: Isaac-Forge-PegInsert-Direct-v0
  cfg:
    decimation: 8
    episode_length_s: 10.0

wandb:
  entity: hur
  project: forge_pih

trainer:
  learner: sac
  total_timesteps: 50000
  write_interval: 1000
  checkpoint_interval: 10000
