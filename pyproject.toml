[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robonuke_rl_core"
version = "0.1.0"
description = "Shared RL core for Isaac Lab: config manager, models, skrl integration, training and eval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoboNuke" }]
# Only what an Isaac Lab environment does NOT already provide. Isaac Lab (and its
# torch/gymnasium/numpy) must already be installed -- see README "Install". Built against
# Isaac Lab 0.47.1 / Isaac Sim 5.1.0 / Python 3.11.
dependencies = [
    "pyyaml",
    "omegaconf>=2.3",
    "skrl>=2.1",
    "wandb>=0.19.10",
    "pandas",
    "pyarrow",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["robonuke_rl_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/learners"]
# plain `pytest` runs the CPU tests; `pytest -m gpu` runs the ones that need Isaac Sim.
# the ROS 2 pytest plugins are on sys.path in a sourced ROS shell and fail to import there.
addopts = "-m 'not gpu' -p no:launch_testing -p no:launch_ros"
