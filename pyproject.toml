[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robonuke_rl_core"
version = "0.1.0"
description = "Shared RL core for Isaac Lab: config manager, models, skrl integration, training and eval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoboNuke" }]
# Only what an Isaac Lab environment does NOT already provide. Isaac Lab (and its
# torch/gymnasium/numpy) must already be installed -- see README "Install". Built against
# Isaac Lab 0.47.1 / Isaac Sim 5.1.0 / Python 3.11.
dependencies = [
    "pyyaml",
    "omegaconf>=2.3",
    "skrl>=2.1",
    "wandb>=0.19.10",
    "pandas",
    "pyarrow",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["robonuke_rl_core*"]

# the job scripts are submitted by path, so they ship with the package
[tool.setuptools.package-data]
robonuke_rl_core = ["hpc/*.bash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the test-helper modules are plain modules (two conftest.py on the path shadow each other),
# so their directories go on the path. Test file basenames must stay unique across tests/:
# there is no __init__.py, so pytest names modules by basename alone.
pythonpath = [".", "tests/learners", "tests/hpc"]
# plain `pytest` runs the CPU tests; `pytest -m gpu` runs the ones that need Isaac Sim and
# `pytest -m hpc` the ones that need a real cluster.
# the ROS 2 pytest plugins are on sys.path in a sourced ROS shell and fail to import there.
addopts = "-m 'not gpu and not hpc' -p no:launch_testing -p no:launch_ros"
